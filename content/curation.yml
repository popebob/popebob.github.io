case_studies_intro: >-
  Four engagements that show the pattern: walk into a hard situation, take
  ownership beyond the original mandate, leave behind an organization and a
  platform that outlast the tenure.

case_studies:
  - number: "01"
    company: "Opala"
    title: "A platform organization turned around mid-flight"
    role: "Director of Platform Engineering"
    period: "2025 – present"
    location: "Seattle, WA (remote)"
    metric: "$1.8M → positive"
    metric_label: "inherited budget deficit, closed within the first year"
    ops_status: "budget positive"
    situation: >-
      Arrived in March 2025 to a Platform Engineering organization running a
      $1.8M budget deficit — on a HIPAA-regulated healthcare data platform
      subject to CMS interoperability mandates, where reliability and
      compliance are not negotiable.
    action: >-
      Took ownership of a $5–7M annual budget and a 10-person
      multi-disciplinary organization spanning cloud infrastructure, DevOps,
      SRE, cybersecurity, audit/compliance, and corporate IT. Established SRE
      practices, observability standards, and incident-response frameworks,
      and drove multi-cloud (AWS/Azure) architecture decisions with security
      and compliance as first-class design constraints — deploying to
      production daily via IaC and GitHub Actions, with GitHub OIDC
      federation and centralized DevSecOps policy enforcement.
    result: >-
      The deficit closed to positive within the first year — and the mandate
      grew rather than shrank: the role expanded from Cloud DevOps and IT
      Operations to also own Security Engineering and Security Operations,
      with an org-chart redesign to match, and the SOC 2 program repositioned
      as a business enabler rather than a checkbox exercise.
    tags:
      - "HIPAA"
      - "SOC 2"
      - "CMS Interoperability"
      - "AWS · Azure"
      - "FinOps"

  - number: "02"
    company: "Ford Motor Company"
    title: "From two-person skunkworks to a 150-person organization"
    role: "Cloud & DevOps Consultant → DevOps Principal Architect"
    period: "2015 – 2018"
    location: "Dearborn, MI"
    metric: "2 → 150"
    metric_label: "people — including Ford's first offshore production operations"
    ops_status: "delivered at scale"
    situation: >-
      Ford's data center and hosting infrastructure needed a next-generation
      vision. What existed was a two-person "skunkworks" lab — inside an
      enterprise where compliance had never been a first-class design
      requirement for infrastructure.
    action: >-
      Defined the Data Center of the Future architecture across compute,
      storage, network, cloud, and hosting, and established the Next
      Generation Lab as a production-grade proving ground with full asset,
      service-delivery, and vendor-management ownership — progressing from
      individual contributor to Director-level contractor. Delivered
      platforms including Kubernetes (Containers as a Service), Pivotal
      Cloud Foundry, SQL Server PaaS, VMware vRealize Operations, IBM API
      Connect, and F5 iWorkflow, while serving as lead architect and agile
      coach across a concurrent PaaS portfolio influencing hundreds of
      engineers.
    result: >-
      A 150-person organization — including Ford's first offshore production
      operations — established as the enterprise's Next Generation Data
      Center function. Foundational infrastructure of a live global operation
      was replaced in real time with zero downtime. And when the new
      platforms outperformed incumbents, they displaced them: most notably a
      full replacement of Ford's enterprise Active Directory environment,
      absorbing that team's scope into the platform organization.
    callout: >-
      Collaborated directly with Chef co-founder Adam Jacob, HashiCorp
      co-founder Armon Dadgar, and HashiCorp's Seth Vargo on core
      Infrastructure-as-Code tooling and DevOps workflow design as part of
      Ford's IaC and automation strategy.
    tags:
      - "Fortune 100"
      - "Kubernetes CaaS"
      - "Zero-downtime replacement"
      - "Terraform · Ansible · Chef"

  - number: "03"
    company: "Hoylu"
    title: "Promoted and retained through the layoff years"
    role: "Senior DevOps Engineer → Director of DevOps"
    period: "2020 – 2025"
    location: "Kirkland, WA"
    metric: "Senior → Director"
    metric_label: "promoted and retained through multiple company-wide workforce reductions"
    ops_status: "iso 27001 certified"
    situation: >-
      Joined Hoylu — a global SaaS collaboration platform serving enterprise
      and government customers — as a Senior DevOps Engineer in 2020, into a
      company that would go through multiple company-wide workforce
      reductions in the years that followed.
    action: >-
      Owned the full platform engineering function with a team of eight
      DevOps and backend engineers under unified DevSecOps/SRE ownership.
      Reported directly to the VP of Engineering and CEO; designed customer
      usage-based COGS metrics that gave the board real-time visibility into
      cloud unit economics, and led cost-optimization initiatives that
      materially reduced operational spend. Designed a cloud-native platform
      on HashiCorp Nomad with self-healing, automated infrastructure.
    result: >-
      Promoted to Director of DevOps and retained through every workforce
      reduction. Led ISO 27001 certification end-to-end — achieved in 2022 —
      and architected a fully customized SaaS deployment in AWS GovCloud
      with FedRAMP Moderate compliance activities, unlocking enterprise and
      government customer acquisition. The platform supported a public SLA
      without headcount growth.
    tags:
      - "ISO 27001"
      - "AWS GovCloud"
      - "FedRAMP Moderate"
      - "HashiCorp stack"
      - "Cloud unit economics"

  - number: "04"
    company: "Plex Systems"
    title: "Building the deploy muscle behind a 99.9% SLA"
    role: "Data Center Administrator → DevOps Team Lead"
    period: "2012 – 2015"
    location: "Auburn Hills, MI"
    metric: "90%"
    metric_label: "VM build-time reduction through automation"
    ops_status: "deploys continuous"
    situation: >-
      Plex ran a 24/7, SOX 404-compliant SaaS environment with a 99.9% SLA —
      and deployment frequency was periodic, not continuous.
    action: >-
      Built the company's initial CI/CD, Infrastructure-as-Code, and ChatOps
      toolchain — promoted from Data Center Administrator to DevOps Team
      Lead along the way.
    result: >-
      Deployment frequency went from periodic to continuous, including
      blue/green and mid-day production deployments in a 99.9% SLA
      environment. VM build time dropped 90% through automation — cutting
      SOX 404 audit burden in the process — and the work was recognized
      with the 2014 Q3 "Plex Impact" Innovation Award.
    tags:
      - "SOX 404"
      - "CI/CD from zero"
      - "ChatOps"
      - "99.9% SLA"

