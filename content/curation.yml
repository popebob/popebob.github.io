# primary content source: identity, contact, summary, skills, the experience
# timeline, and credentials are all parsed from it by build.py. This file
# holds ONLY what a flat CV can't express: case-study narratives, the stat
# strip, section intros, timeline badge/highlight polish, and compliance
# grouping.
#
# Every fact here must trace to the master CV or the Verified facts in the
# private resume repo's CLAUDE.md. Never add a tool, metric, or number that
# isn't in those sources.
# ---------------------------------------------------------------------------

