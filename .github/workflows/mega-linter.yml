name: MegaLinter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/cupcake@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: pull_request
          APPLY_FIXES_MODE: commit

      - name: Publish results to job summary
        if: always()
        run: |
          REPORT=megalinter-reports/megalinter-report.md
          {
            echo "## MegaLinter results"
            echo
            if [ -s "$REPORT" ]; then
              cat "$REPORT"
            elif [ -f megalinter-reports/megalinter.log ]; then
              echo "_Markdown report missing; falling back to the run log summary._"
              echo
              echo '```text'
              sed 's/\x1b\[[0-9;]*m//g' megalinter-reports/megalinter.log \
                | awk '/----SUMMARY----/,0'
              echo '```'
            else
              echo "_No MegaLinter report produced._"
            fi
            echo
            echo "Outcome: **${{ steps.ml.outcome }}** — full reports are attached as the \`megalinter-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 14
