name: MegaLinter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/cupcake@v8
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo "## MegaLinter results"
            echo
            if [ -f megalinter-reports/megalinter.log ]; then
              # The run summary table sits between the SUMMARY banner and the
              # trailing rule; fall back to the whole tail if the shape changes.
              awk '/----SUMMARY----/,0' megalinter-reports/megalinter.log \
                | sed 's/\x1b\[[0-9;]*m//g' > /tmp/ml-summary.txt || true
              if [ -s /tmp/ml-summary.txt ]; then
                echo '```text'
                cat /tmp/ml-summary.txt
                echo '```'
              else
                echo "_Summary table not found in the log._"
              fi
            else
              echo "_No MegaLinter log produced._"
            fi
            echo
            echo "Outcome: **${{ steps.ml.outcome }}**"
            echo
            echo "Full reports are attached to this run as the \`megalinter-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 14
